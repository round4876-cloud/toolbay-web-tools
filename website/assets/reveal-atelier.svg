<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="limestoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="60%" stop-color="#F3EBE1"/>
      <stop offset="100%" stop-color="#E8DDD1"/>
    </linearGradient>

    <linearGradient id="brassReveal" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F4E3BF"/>
      <stop offset="35%" stop-color="#DCBE80"/>
      <stop offset="70%" stop-color="#BA904C"/>
      <stop offset="100%" stop-color="#8F6322"/>
    </linearGradient>

    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="50%" stop-color="#5C3A1E"/>
      <stop offset="100%" stop-color="#3B2210"/>
    </linearGradient>

    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBEC3"/>
      <stop offset="50%" stop-color="#EF6F79"/>
      <stop offset="100%" stop-color="#A8323D"/>
    </linearGradient>

    <filter id="revealShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="12" dy="20" stdDeviation="18" flood-color="#352628" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Limestone Slab Surface -->
  <rect width="1200" height="900" fill="url(#limestoneBg)"/>

  <!-- Architectural Parchment Sketchbook in Background -->
  <g filter="url(#revealShadow)">
    <rect x="250" y="140" width="680" height="460" rx="12" fill="#FAF5ED" stroke="#E2D4C3" stroke-width="2"/>
    <!-- Spine binding -->
    <rect x="580" y="140" width="20" height="460" fill="#E8DDCF"/>
    <line x1="590" y1="140" x2="590" y2="600" stroke="#C9B8A4" stroke-width="2"/>
    <!-- Sketch page lines -->
    <g stroke="rgba(115, 103, 105, 0.22)" stroke-width="1.2">
      <!-- Golden Spiral Sketch on Left Page -->
      <path d="M 380,480 A 180,180 0 0,1 560,300 A 110,110 0 0,1 450,190 A 70,70 0 0,1 380,260 A 45,45 0 0,1 425,305 A 28,28 0 0,1 453,277" fill="none" stroke="#EF6F79" stroke-width="1.8"/>
      <!-- Grid rectangles -->
      <rect x="380" y="300" width="180" height="180" fill="none" stroke-dasharray="3 3"/>
      <rect x="450" y="190" width="110" height="110" fill="none" stroke-dasharray="3 3"/>
      <!-- Drafting notes -->
      <line x1="640" y1="220" x2="860" y2="220"/>
      <line x1="640" y1="260" x2="880" y2="260"/>
      <line x1="640" y1="300" x2="820" y2="300"/>
      <line x1="640" y1="340" x2="890" y2="340"/>
      <line x1="640" y1="380" x2="850" y2="380"/>
      <line x1="640" y1="420" x2="870" y2="420"/>
    </g>
    <!-- Handwritten notation -->
    <text x="640" y="195" font-family="'Caveat Brush', cursive" font-size="24" fill="#EF6F79">Ratio Divina: 1.6180339...</text>
  </g>

  <!-- Solid Brass Golden Ratio Card (Foreground Left) -->
  <g filter="url(#revealShadow)">
    <rect x="220" y="470" width="460" height="280" rx="8" fill="url(#brassReveal)" stroke="#8A5E1E" stroke-width="2"/>
    <!-- Engraved Golden Spiral -->
    <path d="M 640,490 A 240,240 0 0,0 400,730 A 150,150 0 0,0 550,580 A 90,90 0 0,0 460,490" fill="none" stroke="#54370D" stroke-width="2.5"/>
    <text x="360" y="720" font-family="'Bodoni Moda', serif" font-size="28" font-weight="800" fill="#422907" letter-spacing="3">PHI = 1.618</text>
    <text x="250" y="510" font-family="system-ui, sans-serif" font-size="10" letter-spacing="2" fill="#54370D">ATELIER NUMÉRIQUE</text>
  </g>

  <!-- Antique Brass Magnifying Glass with Walnut Handle -->
  <g filter="url(#revealShadow)">
    <!-- Brass Lens Rim -->
    <circle cx="510" cy="350" r="130" fill="rgba(240, 248, 255, 0.45)" stroke="url(#brassReveal)" stroke-width="22"/>
    <!-- Glass Highlight & Specular Flare -->
    <ellipse cx="480" cy="310" rx="70" ry="35" fill="rgba(255, 255, 255, 0.6)" transform="rotate(-30 480 310)"/>
    <!-- Handle Connector -->
    <rect x="630" y="340" width="40" height="22" rx="4" fill="url(#brassReveal)"/>
    <!-- Turned Walnut Wood Handle -->
    <path d="M 660,342 L 870,395 C 890,400 895,420 875,425 L 660,362 Z" fill="url(#woodHandle)"/>
    <ellipse cx="880" cy="410" rx="14" ry="18" fill="url(#brassReveal)" transform="rotate(15 880 410)"/>
  </g>

  <!-- Brass Caliper Divider (Bottom Right) -->
  <g filter="url(#revealShadow)" transform="rotate(-35 840 680)">
    <circle cx="840" cy="580" r="18" fill="url(#brassReveal)"/>
    <polygon points="835,580 825,600 740,780 745,780 838,580" fill="url(#brassReveal)"/>
    <polygon points="845,580 855,600 940,780 935,780 842,580" fill="url(#brassReveal)"/>
    <circle cx="840" cy="670" r="12" fill="url(#brassReveal)" stroke="#6B4610" stroke-width="2"/>
  </g>

  <!-- Dried Dusty Pink Roses Bouquet (Right Side) -->
  <g filter="url(#revealShadow)">
    <!-- Stems -->
    <path d="M 880,480 Q 940,560 970,680" stroke="#7A6852" stroke-width="4" fill="none"/>
    <path d="M 910,470 Q 950,550 1020,660" stroke="#685642" stroke-width="3.5" fill="none"/>
    <path d="M 830,500 Q 890,580 910,690" stroke="#7A6852" stroke-width="3" fill="none"/>
    <!-- Rose Bloom 1 -->
    <g transform="translate(850, 430)">
      <circle cx="30" cy="30" r="28" fill="#D6515C"/>
      <path d="M 12,28 C 8,14 26,4 40,12 C 54,20 48,44 30,48 C 18,52 10,40 12,28 Z" fill="url(#roseGradient)"/>
      <path d="M 22,26 C 18,18 30,10 38,15 C 46,21 42,34 32,36 Z" fill="#FFC5CA"/>
    </g>
    <!-- Rose Bloom 2 -->
    <g transform="translate(900, 480)">
      <circle cx="26" cy="26" r="24" fill="#B83A45"/>
      <path d="M 10,24 C 6,12 22,4 34,10 C 46,18 40,38 26,42 Z" fill="url(#roseGradient)"/>
      <path d="M 18,22 C 14,16 26,10 32,14 Z" fill="#FFAAB0"/>
    </g>
    <!-- Rose Bloom 3 -->
    <g transform="translate(810, 490)">
      <circle cx="24" cy="24" r="22" fill="#D6515C"/>
      <path d="M 10,22 C 6,10 20,4 30,8 C 40,14 36,34 22,36 Z" fill="url(#roseGradient)"/>
    </g>
  </g>
</svg>

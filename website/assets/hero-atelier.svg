<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Warm Plaster Base Gradient -->
    <linearGradient id="plasterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="50%" stop-color="#F7F2EC"/>
      <stop offset="100%" stop-color="#EFE7DE"/>
    </linearGradient>

    <!-- Brass Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F2DFB8"/>
      <stop offset="25%" stop-color="#D9B777"/>
      <stop offset="60%" stop-color="#B88E48"/>
      <stop offset="85%" stop-color="#996E2E"/>
      <stop offset="100%" stop-color="#D9B777"/>
    </linearGradient>

    <linearGradient id="brassDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A67C37"/>
      <stop offset="50%" stop-color="#734F18"/>
      <stop offset="100%" stop-color="#4A3008"/>
    </linearGradient>

    <!-- Dusty Pink Petals Gradient -->
    <linearGradient id="petalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB3B8"/>
      <stop offset="40%" stop-color="#EF6F79"/>
      <stop offset="80%" stop-color="#D6515C"/>
      <stop offset="100%" stop-color="#A6333D"/>
    </linearGradient>

    <!-- Marble Texture Gradient -->
    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F3ECE7"/>
      <stop offset="70%" stop-color="#E2D4CD"/>
      <stop offset="100%" stop-color="#D5C3BB"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="15" dy="25" stdDeviation="22" flood-color="#3A2826" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowLight" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="14" stdDeviation="12" flood-color="#4A3432" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#plasterGrad)"/>

  <!-- Architectural Drafting Grid & Coordinate Lines (Haute Horlogerie / Atelier) -->
  <g stroke="rgba(217, 183, 119, 0.22)" stroke-width="1" stroke-dasharray="3 7">
    <line x1="120" y1="0" x2="120" y2="900"/>
    <line x1="280" y1="0" x2="280" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1320" y1="0" x2="1320" y2="900"/>
    <line x1="1480" y1="0" x2="1480" y2="900"/>
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
  </g>

  <!-- Concentric Circular Guides & Astrolabe Radians -->
  <g stroke="rgba(239, 111, 121, 0.16)" stroke-width="1" fill="none">
    <circle cx="800" cy="450" r="380"/>
    <circle cx="800" cy="450" r="300" stroke-dasharray="2 6"/>
    <circle cx="800" cy="450" r="160"/>
    <circle cx="800" cy="450" r="60"/>
    <!-- Crosshairs -->
    <line x1="740" y1="450" x2="860" y2="450" stroke="rgba(239, 111, 121, 0.35)" stroke-width="1.5"/>
    <line x1="800" y1="390" x2="800" y2="510" stroke="rgba(239, 111, 121, 0.35)" stroke-width="1.5"/>
  </g>

  <!-- Editorial Fine Typography Markings in Plaster -->
  <text x="140" y="210" font-family="'Bodoni Moda', serif" font-size="14" letter-spacing="4" fill="rgba(60, 40, 42, 0.35)">ATELIER DES MESURES • FIG. 01</text>
  <text x="140" y="235" font-family="system-ui, sans-serif" font-size="10" letter-spacing="2" fill="rgba(60, 40, 42, 0.3)">LAT 48° 51' 24" N — LONG 02° 21' 07" E</text>
  <text x="1340" y="210" font-family="'Bodoni Moda', serif" font-size="14" letter-spacing="4" fill="rgba(60, 40, 42, 0.35)">TOLÉRANCE: ±0.00001%</text>

  <!-- Marble Pyramid Sculpture (Left) -->
  <g filter="url(#shadowHeavy)">
    <polygon points="340,320 220,540 460,540" fill="url(#marbleGrad)"/>
    <polygon points="340,320 460,540 410,500" fill="rgba(180, 155, 145, 0.35)"/>
    <polygon points="220,540 340,570 460,540" fill="rgba(120, 95, 85, 0.25)"/>
    <!-- Marble veining -->
    <path d="M 310,380 Q 280,440 320,490 T 360,530" stroke="rgba(110, 85, 75, 0.22)" stroke-width="1.5" fill="none"/>
    <path d="M 330,350 Q 380,410 390,480" stroke="rgba(140, 115, 105, 0.18)" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Marble Cube Base (Center) -->
  <g filter="url(#shadowHeavy)">
    <polygon points="730,420 850,420 810,480 690,480" fill="#FFFFFF"/>
    <polygon points="690,480 810,480 810,610 690,610" fill="url(#marbleGrad)"/>
    <polygon points="810,480 850,420 850,550 810,610" fill="#C9B8B0"/>
    <path d="M 720,490 Q 760,530 750,580" stroke="rgba(100, 80, 75, 0.25)" stroke-width="1.4" fill="none"/>
  </g>

  <!-- Luxury Precision Brass Caliper (Hero Instrument - Centered diagonally) -->
  <g filter="url(#shadowHeavy)" transform="rotate(-18 800 450)">
    <!-- Main Beam -->
    <rect x="420" y="445" width="760" height="38" rx="4" fill="url(#brassGrad)"/>
    <rect x="420" y="445" width="760" height="6" fill="rgba(255, 255, 255, 0.45)"/>
    <rect x="420" y="477" width="760" height="6" fill="url(#brassDark)"/>

    <!-- Fixed Jaw Left -->
    <path d="M 420,445 L 360,330 C 350,310 330,315 340,340 L 410,483 L 420,483 Z" fill="url(#brassGrad)"/>
    <path d="M 420,483 L 370,620 C 360,645 340,635 350,610 L 410,483 Z" fill="url(#brassGrad)"/>

    <!-- Millimeter Measurement Graduation Ticks on Main Beam -->
    <g stroke="#4A3008" stroke-width="1.2">
      <!-- 50 graduation ticks -->
      <line x1="480" y1="445" x2="480" y2="465"/>
      <line x1="495" y1="445" x2="495" y2="455"/>
      <line x1="510" y1="445" x2="510" y2="455"/>
      <line x1="525" y1="445" x2="525" y2="455"/>
      <line x1="540" y1="445" x2="540" y2="460"/>
      <line x1="555" y1="445" x2="555" y2="455"/>
      <line x1="570" y1="445" x2="570" y2="455"/>
      <line x1="585" y1="445" x2="585" y2="455"/>
      <line x1="600" y1="445" x2="600" y2="465"/>
      <line x1="660" y1="445" x2="660" y2="465"/>
      <line x1="720" y1="445" x2="720" y2="465"/>
      <line x1="780" y1="445" x2="780" y2="465"/>
      <line x1="840" y1="445" x2="840" y2="465"/>
      <line x1="900" y1="445" x2="900" y2="465"/>
      <line x1="960" y1="445" x2="960" y2="465"/>
      <line x1="1020" y1="445" x2="1020" y2="465"/>
      <line x1="1080" y1="445" x2="1080" y2="465"/>
      <line x1="1140" y1="445" x2="1140" y2="465"/>
    </g>

    <!-- Caliper Slider Vernier Block -->
    <g filter="url(#shadowLight)">
      <rect x="680" y="435" width="130" height="58" rx="6" fill="url(#brassGrad)"/>
      <rect x="680" y="435" width="130" height="4" fill="rgba(255, 255, 255, 0.6)"/>
      <!-- Sliding Upper & Lower Jaws -->
      <path d="M 680,435 L 640,335 C 635,320 620,325 625,345 L 675,445 Z" fill="url(#brassGrad)"/>
      <path d="M 680,493 L 645,615 C 640,630 625,625 630,605 L 675,483 Z" fill="url(#brassGrad)"/>
      <!-- Knurled Thumb Lock Wheel -->
      <ellipse cx="745" cy="430" rx="18" ry="8" fill="url(#brassDark)"/>
      <ellipse cx="745" cy="428" rx="16" ry="6" fill="url(#brassGrad)"/>
      <!-- Caliper Vernier Scale Inscription -->
      <text x="695" y="470" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#3D2808" letter-spacing="1">VERNIER 0.02</text>
    </g>

    <!-- Caliper Depth Probe Rod Extender -->
    <rect x="1175" y="458" width="140" height="12" fill="url(#brassDark)"/>
    <rect x="1175" y="458" width="140" height="3" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Architectural Drafting Compass / Divider (Foreground) -->
  <g filter="url(#shadowHeavy)" transform="translate(140, 110)">
    <!-- Hinge Joint Ring -->
    <circle cx="800" cy="520" r="22" fill="url(#brassDark)"/>
    <circle cx="800" cy="520" r="16" fill="url(#brassGrad)"/>
    <circle cx="800" cy="520" r="6" fill="#3D2808"/>
    <!-- Left Leg -->
    <polygon points="794,520 782,540 670,780 664,780 790,520" fill="url(#brassGrad)"/>
    <!-- Right Leg -->
    <polygon points="806,520 818,540 930,780 936,780 810,520" fill="url(#brassGrad)"/>
    <!-- Steel Needle Tips -->
    <polygon points="670,780 666,825 664,780" fill="#6E727A"/>
    <polygon points="930,780 934,825 936,780" fill="#6E727A"/>
    <!-- Center Adjustment Wheel Screw -->
    <rect x="730" y="625" width="140" height="8" rx="2" fill="url(#brassDark)"/>
    <circle cx="800" cy="629" r="14" fill="url(#brassGrad)"/>
    <circle cx="800" cy="629" r="10" fill="#4A3008"/>
  </g>

  <!-- Apothecary Glass Amber Bottle "CALCULUS II" (Upper Right) -->
  <g filter="url(#shadowHeavy)">
    <!-- Glass Bottle Body -->
    <rect x="1140" y="320" width="130" height="240" rx="28" fill="rgba(196, 122, 45, 0.72)"/>
    <rect x="1150" y="325" width="18" height="230" rx="9" fill="rgba(255, 235, 190, 0.45)"/>
    <!-- Neck & Stopper -->
    <rect x="1180" y="270" width="50" height="50" rx="6" fill="rgba(176, 105, 35, 0.85)"/>
    <path d="M 1170,270 L 1240,270 L 1230,230 L 1180,230 Z" fill="rgba(150, 85, 25, 0.95)"/>
    <ellipse cx="1205" cy="225" rx="30" ry="12" fill="url(#brassGrad)"/>
    <!-- Vintage Label -->
    <rect x="1155" y="380" width="100" height="120" rx="4" fill="#FAF5ED" stroke="#4A3008" stroke-width="1.5"/>
    <rect x="1160" y="385" width="90" height="110" rx="2" fill="none" stroke="rgba(239, 111, 121, 0.4)" stroke-width="1"/>
    <text x="1205" y="425" font-family="'Bodoni Moda', serif" font-weight="800" font-size="13" text-anchor="middle" fill="#2E1C1D" letter-spacing="1">CALCULUS</text>
    <text x="1205" y="450" font-family="'Bodoni Moda', serif" font-weight="700" font-size="16" text-anchor="middle" fill="#EF6F79">II</text>
    <text x="1205" y="475" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#6E5E60" letter-spacing="2">PRECISION APOTHECARY</text>
  </g>

  <!-- Clear Glass Bottle "AETERNA 04" (Far Right) -->
  <g filter="url(#shadowLight)">
    <rect x="1310" y="360" width="110" height="210" rx="22" fill="rgba(255, 255, 255, 0.55)" stroke="rgba(200, 190, 185, 0.6)" stroke-width="1.5"/>
    <rect x="1318" y="365" width="12" height="200" rx="6" fill="rgba(255, 255, 255, 0.8)"/>
    <rect x="1345" y="320" width="40" height="40" rx="4" fill="rgba(240, 240, 240, 0.6)"/>
    <ellipse cx="1365" cy="315" rx="24" ry="10" fill="rgba(255, 255, 255, 0.85)" stroke="#D5C5BE"/>
    <!-- Label -->
    <rect x="1325" y="415" width="80" height="100" rx="3" fill="#FFFFFF" stroke="#D5C5BE"/>
    <text x="1365" y="455" font-family="'Bodoni Moda', serif" font-weight="800" font-size="11" text-anchor="middle" fill="#1D1718" letter-spacing="1">AETERNA</text>
    <text x="1365" y="475" font-family="'Bodoni Moda', serif" font-size="14" text-anchor="middle" fill="#EF6F79">04</text>
  </g>

  <!-- Dusty Pink Rose Petals Scattered Naturally Across Composition -->
  <!-- Petal 1 (Left near marble) -->
  <path d="M 240,620 C 220,590 260,570 280,590 C 300,610 270,640 240,620 Z" fill="url(#petalPink)" filter="url(#shadowLight)" transform="rotate(25 250 610)"/>
  <!-- Petal 2 (Near caliper jaw) -->
  <path d="M 580,360 C 560,340 590,320 610,335 C 625,355 605,380 580,360 Z" fill="url(#petalPink)" filter="url(#shadowLight)" transform="rotate(-15 590 350)"/>
  <!-- Petal 3 (Center foreground) -->
  <path d="M 880,690 C 850,670 890,645 915,665 C 935,685 910,715 880,690 Z" fill="url(#petalPink)" filter="url(#shadowLight)" transform="rotate(40 890 680)"/>
  <!-- Petal 4 (Under compass leg) -->
  <path d="M 1040,740 C 1020,725 1050,705 1070,720 C 1090,740 1065,765 1040,740 Z" fill="url(#petalPink)" filter="url(#shadowLight)" transform="rotate(-30 1050 735)"/>
  <!-- Petal 5 (Near right bottles) -->
  <path d="M 1240,600 C 1220,580 1260,560 1280,580 C 1300,600 1270,625 1240,600 Z" fill="url(#petalPink)" filter="url(#shadowLight)" transform="rotate(10 1250 595)"/>

  <!-- Antique Dried Rose Bloom (Bottom Right Corner) -->
  <g filter="url(#shadowHeavy)" transform="translate(1420, 680) rotate(-20)">
    <circle cx="40" cy="40" r="32" fill="#D6515C"/>
    <path d="M 20,40 C 15,25 35,10 50,20 C 65,30 60,55 40,60 C 25,65 15,50 20,40 Z" fill="#EF6F79"/>
    <path d="M 28,38 C 22,28 36,18 46,24 C 56,32 50,48 38,50 Z" fill="#FFB3B8"/>
    <path d="M 34,36 C 30,30 40,24 45,28 C 50,33 46,42 38,42 Z" fill="#8C242D"/>
  </g>

  <!-- Hairline Museum Plaster Seal (Top Center) -->
  <circle cx="800" cy="80" r="36" fill="none" stroke="rgba(239, 111, 121, 0.45)" stroke-width="1.5"/>
  <circle cx="800" cy="80" r="32" fill="none" stroke="rgba(217, 183, 119, 0.4)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="800" y="85" font-family="'Bodoni Moda', serif" font-size="16" font-weight="800" text-anchor="middle" fill="#EF6F79">TB</text>
</svg>
